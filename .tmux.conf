# 마우스 스크롤/클릭 활성화
set -g mouse on

# 클라이언트마다 창 크기 독립 유지 (여러 터미널에서 접속 시 최소 크기 강제 방지)
setw -g aggressive-resize on

# 터미널 창 크기 변경 시 team 세션 오른쪽 pane 5개 균등 분배
set-hook -g client-resized "run-shell ~/team-resize.sh"
set-hook -g after-resize-window "run-shell ~/team-resize.sh"

# 세션 복원 플러그인 (선택사항 — 없으면 자동으로 건너뜀)
if-shell "[ -f ~/.tmux/plugins/tmux-resurrect/resurrect.tmux ]" \
  "run-shell ~/.tmux/plugins/tmux-resurrect/resurrect.tmux"
